[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-paper-agent"
version = "2.0.0a1"
description = "Evidence-grounded paper-to-PyTorch implementation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langgraph>=0.3,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "openai>=1.68,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
worker = ["numpy>=2,<3", "torch>=2.5,<3"]
dev = [
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
paper-agent-api = "paper_agent_v2.api:run"
paper-agent-worker = "paper_agent_v2.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"src/paper_agent_v2/api.py" = ["S104"]
"src/paper_agent_v2/generation/package_writer.py" = ["S701"]
"src/paper_agent_v2/sandbox.py" = ["S108", "S603"]
